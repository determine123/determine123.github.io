name: Build ThoughtLite and deploy the blog

on:
  push:
    branches: [main, migration/native-thought-lite]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Cache public avatar locally
        run: |
          if curl --fail --location --retry 2 --max-time 30 'https://avatars.githubusercontent.com/u/182319045?s=240&v=4' -o /tmp/avatar.png; then
            mv /tmp/avatar.png img/avatar.png
          else
            echo '::warning::Avatar download failed; retaining the remote fallback.'
          fi
      - name: Verify project directory sync
        run: python3 -m unittest discover -s tests -p "test_sync_projects.py" -v
      - name: Verify Vercel packaging
        run: python3 -m unittest discover -s tests -p "test_prepare_vercel.py" -v
      - name: Verify visit statistics
        run: node --test tests/test_visit_stats.cjs tests/test_site_statistics.cjs
      - name: Verify blog Agent API
        run: |
          node --check js/blog-agent.js
          node --check workers/blog-agent/src/index.js
          node --test tests/test_blog_agent_worker.cjs
      - name: Generate site timestamps
        run: python3 .github/scripts/site_status.py
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.3.0'
      - name: Install content importer
        run: python3 -m pip install beautifulsoup4==4.15.0 PyYAML==6.0.3
      - name: Import original content without losing historical links
        run: python3 .github/scripts/prepare_astro.py
      - name: Install actual ThoughtLite template dependencies
        run: pnpm --dir astro-site install --frozen-lockfile
      - name: Build Astro ThoughtLite
        run: pnpm --dir astro-site build
      - name: Verify content, aliases, widgets and photo resources
        run: python3 .github/scripts/verify_astro.py
      - name: Restore bilingual translation cache
        uses: actions/cache@v4
        with:
          path: ~/blog-translations
          key: bilingual-v1-${{ github.sha }}
          restore-keys: bilingual-v1-
      - name: Generate English and Chinese editions
        run: |
          python3 -m pip install ctranslate2==4.8.5 sentencepiece
          mkdir -p ~/blog-translations
          cd ~/blog-translations
          if [ ! -f model/translate-zh_en-1_9/model/model.bin ]; then
            curl -fL --retry 4 https://argos-net.com/v1/translate-zh_en-1_9.argosmodel -o model.zip
            echo '62e7af5a3a48b530e47b7b3e5c78c2de79073ecd815750d2bf3ab35b4a67da2d  model.zip' | sha256sum -c -
            unzip -qo model.zip -d model
          fi
          cd "$GITHUB_WORKSPACE"
          python3 .github/scripts/bilingual_site.py astro-site/dist ~/blog-translations/model ~/blog-translations/text.json
      - name: Upload verified Astro output
        uses: actions/upload-pages-artifact@v3
        with:
          path: astro-site/dist
      - name: Prepare Vercel prebuilt output
        run: python3 .github/scripts/prepare_vercel.py astro-site/dist
      - name: Upload Vercel prebuilt output
        uses: actions/upload-artifact@v4
        with:
          name: vercel-prebuilt-site
          path: .vercel/output/
          include-hidden-files: true
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published homepage
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 30 "$PAGE_URL" -o /tmp/blog-home.html
          python3 - <<'PY'
          from pathlib import Path
          html = Path('/tmp/blog-home.html').read_text(encoding='utf-8')
          assert re.search(r'<meta(?=[^>]*name="generator")(?=[^>]*content="Astro)[^>]*>', html), 'Homepage is not built by Astro'
          assert 'id="sidebar-open"' in html, 'Missing ThoughtLite navigation'
          assert 'id="page-content"' in html, 'Missing content container'
          assert 'id="global-music"' in html, 'Missing preserved music player'
          assert 'id="blog-agent-dialog"' in html, 'Missing preserved Agent'
          assert 'id="search-dialog"' in html, 'Missing preserved search'
          print('Verified native Astro ThoughtLite homepage and preserved widgets.')
          PY

  deploy-vercel:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Download mirror package
        uses: actions/download-artifact@v4
        with:
          name: vercel-prebuilt-site
          path: .vercel/output
      - name: Link Vercel project
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_ORG_ID" || { echo '::error::VERCEL_ORG_ID is missing'; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo '::error::VERCEL_PROJECT_ID is missing'; exit 1; }
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s","projectName":"determine-blog"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
      - name: Deploy Vercel mirror
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo '::error::VERCEL_TOKEN is missing'; exit 1; }
          npx --yes vercel@latest deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
      - name: Verify Vercel mirror
        run: |
          set -euo pipefail
          base='https://determine-blog.vercel.app'
          for path in / /learning/ /about/; do
            file="$(mktemp)"
            curl --fail --location --retry 4 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 30 "$base$path" -o "$file"
            python3 - "$file" "$path" <<'PY'
          from pathlib import Path
          import re
          import sys

          html = Path(sys.argv[1]).read_text(encoding='utf-8')
          path = sys.argv[2]
          assert not re.search(r'\{%|\{\{', html), f'{path} contains unrendered Jekyll Liquid'
          assert '<title>' in html.lower(), f'{path} is missing a rendered title'
          assert re.search(r'<meta(?=[^>]*name="generator")(?=[^>]*content="Astro)[^>]*>', html), f'{path} is not built by Astro'
          if path == '/':
              assert 'id="sidebar-open"' in html, 'Missing native ThoughtLite navigation'
              assert 'id="blog-agent-open"' in html, 'Homepage is missing the blog Agent launcher'
          print(f'Verified {path}: rendered Jekyll page with expected shared layout.')
          PY
            rm "$file"
          done
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 3 "$base/favicon.svg" -o /dev/null
